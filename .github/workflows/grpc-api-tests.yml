name: Service gRPC CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "services/grpc/**"

jobs:
  automated-grpc-tests:
    runs-on: ubuntu-latest

    env:
      PATH: /home/runner/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: services/grpc
        run: docker build -t grpc-chat-service .

      - name: Run gRPC chat service container
        run: |
          docker run -d --name grpc-chat-service -p 50052:50052 grpc-chat-service
          sleep 3
          docker logs grpc-chat-service

      - name: Install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: Wait for gRPC service
        run: |
          for i in {1..15}; do
            if grpcurl -plaintext localhost:50052 list 2>&1; then
              echo "gRPC service is ready"
              exit 0
            fi
            echo "Attempt $i: not ready yet"
            sleep 2
          done
          echo "gRPC service failed to start"
          docker logs grpc-chat-service
          exit 1

      - name: Run gRPC tests
        run: |
          echo "Test 1: SendMessage (valid)"
          grpcurl -plaintext -d '{"username": "alice", "content": "Hello from CI!"}' localhost:50052 chat.ChatService/SendMessage

          echo "Test 2: SendMessage (empty username — expect INVALID_ARGUMENT)"
          grpcurl -plaintext -d '{"username": "", "content": "Should fail"}' localhost:50052 chat.ChatService/SendMessage 2>&1 && exit 1 || true

          echo "Test 3: SendMessage (empty content — expect INVALID_ARGUMENT)"
          grpcurl -plaintext -d '{"username": "alice", "content": ""}' localhost:50052 chat.ChatService/SendMessage 2>&1 && exit 1 || true

          echo "Test 4: SendMessage (second valid message)"
          grpcurl -plaintext -d '{"username": "bob", "content": "Hey alice!"}' localhost:50052 chat.ChatService/SendMessage

          echo "All gRPC tests passed!"
