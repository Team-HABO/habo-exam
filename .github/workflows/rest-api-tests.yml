name: Service REST CI

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "services/rest/**"
  pull_request:
    branches:
      - main
    paths:
      - "services/rest/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: services/rest

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore rest/rest.csproj 

      - name: Build REST API
        run: dotnet build rest/rest.csproj -c Release --no-restore

      - name: Start REST API Server in background
        run: |
          export ConnectionStrings__DefaultConnection="Data Source=rest/movies.db"
          export REDIS_CONNECTION_STRING="127.0.0.1:6379"
          nohup dotnet run --project rest/rest.csproj --urls http://localhost:8080 > server.log 2>&1 &
          echo $! > server.pid
          # give the process a moment to start and write logs
          sleep 1

      - name: Wait for Server to be Ready
        run: |
          status=""
          for i in {1..60}; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/movies || true)
            if [ "$status" = "200" ] || [ "$status" = "401" ]; then
              echo "API is ready (HTTP $status)"; break
            fi
            # if server process exited, show logs and fail early
            if [ -f server.pid ]; then
              pid=$(cat server.pid)
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "Server process $pid exited unexpectedly"; cat server.log || true; exit 1
              fi
            fi
            sleep 1
          done
          if [ "$status" != "200" ] && [ "$status" != "401" ]; then
            echo "Server did not become ready in time"; cat server.log || true; exit 1
          fi

      - name: Smoke test API
        run: |
          curl -v http://localhost:8080/api/v1/movies || {
            echo "--- server.log ---"
            cat server.log || true
            exit 1
          }

      - name: Print server logs
        if: always()
        run: cat server.log || true
        