name: Service REST CI

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "services/rest/**"
  pull_request:
    branches:
      - main
    paths:
      - "services/rest/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: services/rest

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore rest/rest.csproj # Points to services/rest/rest/rest.csproj

      - name: Build REST API
        run: dotnet build rest/rest.csproj -c Release --no-restore

      - name: Start REST API Server in background
        run: |
          export ConnectionStrings__DefaultConnection="Data Source=rest/movies.db"
          dotnet run --project rest/rest.csproj --urls http://localhost:8080 &

      - name: Wait for Server to be Ready
        run: |
          for i in {1..30}; do
             status=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/movies || true)
             if [ "$status" = "200" ] || [ "$status" = "401" ]; then
               echo "API is ready (HTTP $status)"; break
            fi
            sleep 1
          done

      - name: Smoke test API
        run: curl -v http://localhost:8080/api/v1/movies || (echo "Smoke test failed" && exit 1)
        